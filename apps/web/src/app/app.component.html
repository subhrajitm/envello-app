<a href="#main-content" class="skip-link">Skip to main content</a>
@if (isOffline()) {
<div class="offline-banner" role="status" aria-live="polite">
  <span class="material-symbols-outlined" style="font-size:15px;" aria-hidden="true">cloud_off</span>
  You're offline — changes will sync when you reconnect.
</div>
}
@if (updateAvailable()) {
<div class="sw-update-banner">
  A new version is available.
  <button (click)="applyUpdate()">Reload to update</button>
</div>
}
<div class="dashboard">
  @if (!isFullScreen()) {
  <lib-header [activeTab]="currentTab()" [isImmersive]="isImmersive()"
    (sidebarCollapsedChange)="onSidebarCollapsedChange($event)">
  </lib-header>
  }

  <div id="main-content" class="dashboard-content" [class.no-padding]="hasSidebar() || isFullScreen()"
    [class.immersive-view]="isImmersive()"
    [class.with-sidebar]="!isImmersive() && !isFullScreen() && navigationLayout() !== 'horizontal'"
    [class.sidebar-collapsed]="sidebarCollapsed()" [class.horizontal-nav]="navigationLayout() === 'horizontal'"
    [class.fullscreen-content]="isFullScreen()">
    <router-outlet></router-outlet>
  </div>

  @if (!isFullScreen()) {
  <app-footer></app-footer>
  }
</div>
<!-- Keyboard shortcuts modal (? key) -->
<app-keyboard-shortcuts></app-keyboard-shortcuts>
<!-- Onboarding wizard (shown on first run) -->
<app-onboarding></app-onboarding>
<!-- What's New modal (shown after version upgrade) -->
<app-whats-new></app-whats-new>
<!-- Global toast notifications -->
<env-toast></env-toast>
<!-- In-app web preview drawer -->
<env-web-preview></env-web-preview>
