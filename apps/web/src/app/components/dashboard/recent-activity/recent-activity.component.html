<div class="recent-activity flex flex-col">
    <div class="section-header flex items-center justify-between">
        <div class="section-title flex items-center gap-2">
            <span class="material-symbols-outlined section-icon">schedule</span>
            RECENT ACTIVITY
        </div>
        <button class="view-all-link" (click)="viewAll()">View All</button>
    </div>
    <div class="activity-list">
        @for (activity of activities(); track activity.id) {
        <button class="activity-item" (click)="navigateTo(activity)" title="Open {{ activity.title }}">
            <span class="material-symbols-outlined activity-icon">{{ activity.icon }}</span>
            <div class="activity-content">
                <div class="activity-title">{{ activity.title }}</div>
                <div class="activity-meta">
                    <span class="activity-type">{{ activity.type }}</span>
                    <span class="activity-dot">·</span>
                    <span class="activity-time">{{ activity.timeLabel }}</span>
                </div>
            </div>
            <span class="material-symbols-outlined activity-arrow">chevron_right</span>
        </button>
        } @empty {
        <div class="activity-empty">No recent activity yet.</div>
        }
    </div>
</div>
